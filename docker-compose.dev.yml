services:
  # Python/FastAPI Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434  # Backend talks to Ollama via service name 
      - DATABASE_URL=postgresql://user:pass@db:5432/resumedb
    volumes:
      - ./backend:/app  # Hot-reloading for development
    networks:
      - ai-network
    depends_on:
      - ollama

  # React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    ports:
      - "3000:5173"  # Common React convention
    environment:
      - VITE_API_URL=http://localhost:8000  # Browser connects to backend via localhost 
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevents local node_modules from overwriting container's
    networks:
      - ai-network

  # Local LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama-data-dev:/root/.ollama
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge  # Isolates AI services from public internet where possible 

volumes:
  ollama-data-dev: