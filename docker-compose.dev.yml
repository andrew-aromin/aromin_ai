services:
  # Python/FastAPI Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    env_file:
      - ./.env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Hot-reloading for development
    networks:
      - ai-network
    depends_on:
      - ollama

  # React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    env_file:
      - ./.env.dev
    ports:
      - "3000:5173"  # Common React convention
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevents local node_modules from overwriting container's
    networks:
      - ai-network

  # Local LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data-dev:/root/.ollama
      - ./ollama_setup.sh:/ollama_setup.sh
    entrypoint: ["/usr/bin/bash", "/ollama_setup.sh"]
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge  # Isolates AI services from public internet where possible 

volumes:
  ollama-data-dev:
