services:
  # The AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    env_file:
      - .env
    environment:
      - HOME=/home/ubuntu
    volumes:
      - ollama-data:/home/ubuntu/.ollama
      - ./ollama_setup.sh:/ollama_setup.sh
    entrypoint: ["/usr/bin/bash", "/ollama_setup.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev

  # Backend API (FastAPI) — hot reload with uvicorn --reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aromin_ai-backend-dev
    env_file:
      - .env
    depends_on:
      - ollama
    volumes:
      - ./backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    networks:
      - dev

  # Frontend (Vite dev server) — hot reload with HMR
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: aromin_ai-frontend-dev
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "5173"]
    restart: unless-stopped
    networks:
      - dev

  # Reverse Proxy (Nginx Gateway) — uses dev config with HMR support
  nginx:
    image: nginx:alpine
    container_name: aromin_ai-gateway-dev
    ports:
      - "3002:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - dev

  # Redis for pre-cached answers
  redis:
    image: redis:alpine
    container_name: aromin_ai-redis-dev
    restart: unless-stopped
    networks:
      - dev

networks:
  dev:
    driver: bridge

volumes:
  ollama-data:
  frontend-node-modules:
