services:
  # The AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - HOME=/home/ubuntu
    volumes:
      - ollama-data:/home/ubuntu/.ollama
      - ./ollama_setup.sh:/ollama_setup.sh
    entrypoint: ["/usr/bin/bash", "/ollama_setup.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aromin_ai-backend
    env_file:
      - .env
    depends_on:
      - ollama
    volumes:
      - backend-data:/app/data
    restart: always

  # Frontend (Nginx serving static files)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aromin_ai-frontend
    env_file:
      - .env
    restart: always

  # Reverse Proxy (Nginx Gateway)
  nginx:
    image: nginx:alpine
    container_name: aromin_ai-gateway
    ports:
      - "3001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  ollama-data:
  backend-data:
