version: '3.8'

services:
  # The AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ./ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # The FastAPI Backend
  backend:
    build: ./backend
    container_name: resumebot-backend
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434