services:
  # The AI Engine
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - HOME=/home/ubuntu
    volumes:
      - ollama-data:/home/ubuntu/.ollama
      - ./ollama_setup.sh:/ollama_setup.sh
    entrypoint: ["/usr/bin/bash", "/ollama_setup.sh"]
    ports:
      - "11434:11434"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aromin_ai-app
    env_file:
      - ./.env
    depends_on:
      - ollama
    ports:
      - "3000:80"
    volumes:
      - backend-data:/app/backend/data

volumes:
  ollama-data:
  backend-data:
